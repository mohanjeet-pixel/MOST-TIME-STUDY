[project]
name = "most-time-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "xlsxwriter>=3.2",
]

[project.scripts]
most-time-study = "most_time_study:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
